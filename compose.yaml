services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resolveflow
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: resolveflow
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resolveflow']
      interval: 5s
      retries: 10
  redis:
    image: redis:7.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  redis_data:
  postgres_data:
